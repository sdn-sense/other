# WARNING. USE IT AT YOUR OWN RISK!
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
  namespace: sense-lhc
data:
  haproxy.cfg: |
    global
        log stdout format raw local0 debug
        maxconn     4000
        user        haproxy
        group       haproxy
        stats socket /var/lib/haproxy/stats

    defaults
        mode                    tcp
        log                     global
        option                  tcplog
        option                  dontlognull
        retries                 3
        timeout connect         10s
        timeout client          1h
        timeout server          1h
        maxconn                 3000

    listen stats
        bind :::1024
        mode http
        stats enable
        stats hide-version
        stats uri /haproxy_stats

    frontend rangecern
        bind 2602:fcfb:001d:fff1::2:1095 ssl crt /etc/haproxy/certs/haproxy.pem
        mode tcp
        option tcplog
        default_backend backendrangecern

    backend backendrangecern
        mode tcp
        option tcp-check
        server ucsd-xrd 2607:f720:1700:1b30::84:1095 check

    frontend xrd_https
        bind 2602:fcfb:001d:fff1::2:1096 ssl crt /etc/haproxy/certs/haproxy.pem verify optional ca-file /tmp/ca-bundle.pem
        mode http
        option httplog

        http-request set-header X-SSL-ClientCert %[ssl_c_der,base64]
        http-request set-header X-SSL-ClientDN %[ssl_c_s_dn]
        http-request set-header X-SSL-Verify %[ssl_c_verify]

        default_backend xrd_http_backend

    backend xrd_http_backend
        mode http
        server xrd 2607:f720:1700:1b30::84:1095

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: haproxy-ipv6
  namespace: sense-lhc
spec:
  replicas: 1
  serviceName: haproxy-ipv6
  selector:
    matchLabels:
      app: haproxy-ipv6
  template:
    metadata:
      labels:
        app: haproxy-ipv6
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"gateway":["2602:fcfb:1d:fff1::1"],"ips":["2602:fcfb:001d:fff1::2/64"],"mac":"3a:50:46:3c:fa:a1","name":"cern-fff1","default-route":["2602:fcfb:1d:fff1::1"]}]'
    spec:
      tolerations:
      - key: "nautilus.io/reservation"
        operator: "Equal"
        value: "sense"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - ucsd-nrp.cern.ch
      containers:
        - name: haproxy
          image: sdnsense/haproxy:dev
          imagePullPolicy: Always
          command: ["sh","-c","sleep infinity"]
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "4" 
              memory: "4Gi"
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy/
            - name: haproxy-cert
              mountPath: /etc/haproxy/certs
              readOnly: true
          ports:
            - containerPort: 1024
              protocol: TCP 
      volumes:
        - name: haproxy-config
          configMap:
            name: haproxy-config
        - name: haproxy-cert
          secret:
            secretName: haproxy-cert
